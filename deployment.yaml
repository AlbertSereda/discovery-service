apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  labels:
    app: discovery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      name: discovery-service
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: albertsereda/all-in-market-discovery-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
              protocol: TCP
      restartPolicy: Always